services:
  - type: web
    name: lunarsynapse-backend
    env: python
    plan: free
    buildCommand: pip install -r outgraph/requirements.txt
    startCommand: python -m uvicorn outgraph.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
